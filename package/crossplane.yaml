apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-arubacloud
  annotations:
    meta.crossplane.io/maintainer: "ArubaCloud <noreply@arubacloud.it>"
    meta.crossplane.io/source: "https://github.com/Arubacloud/provider-arubacloud"
    meta.crossplane.io/license: "Apache-2.0"
    meta.crossplane.io/description: "A Crossplane provider for managing ArubaCloud resources."
    meta.crossplane.io/iconData: ""
    meta.crossplane.io/readme: |
      # provider-arubacloud

      `provider-arubacloud` is a [Crossplane](https://crossplane.io) provider
      that lets you manage [ArubaCloud](https://www.arubacloud.com) infrastructure
      declaratively using Kubernetes-style APIs — a European cloud platform offering
      virtual machines, managed Kubernetes, managed databases, private networking,
      block storage, and security services.

      ## Resources

      | Category | Managed Resources |
      | --- | --- |
      | **Management** | `Project` |
      | **Compute** | `CloudServer`, `KeyPair` |
      | **Storage** | `BlockStorage`, `Snapshot`, `Backup`, `Restore` |
      | **Network** | `VPC`, `Subnet`, `SecurityGroup`, `SecurityRule`, `ElasticIP`, `VPCPeering`, `VPCPeeringRoute`, `VPNTunnel`, `VPNRoute` |
      | **Container** | `KaaS`, `ContainerRegistry` |
      | **Database** | `DBaaS`, `Database`, `DBaaSUser`, `DatabaseGrant`, `DatabaseBackup` |
      | **Security** | `KMS` |
      | **Schedule** | `ScheduleJob` |

      ## Getting Started

      ### Install the provider

      ```yaml
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      metadata:
        name: provider-arubacloud
      spec:
        package: xpkg.upbound.io/arubacloud/provider-arubacloud:v0.0.2
      ```

      ### Configure credentials

      ```yaml
      apiVersion: arubacloud.crossplane.io/v1beta1
      kind: ProviderConfig
      metadata:
        name: default
        namespace: crossplane-system
      spec:
        credentials:
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: arubacloud-credentials
            key: credentials
      ```

      ## Documentation

      Full documentation and examples are available in the
      [GitHub repository](https://github.com/Arubacloud/provider-arubacloud).
spec:
  capabilities:
    - SafeList
    - SafeStart
  crossplane:
    version: ">=v1.14.0"
