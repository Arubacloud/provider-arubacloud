apiVersion: arubacloud.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: crossplane-system
spec:
  credentials:
    source: Secret
    secretRef:
      name: arubacloud-credentials
      namespace: crossplane-system
      key: credentials
---
# Example credentials secret (do not commit real credentials).
# Create with:
#   kubectl create secret generic arubacloud-credentials \
#     -n crossplane-system \
#     --from-literal=credentials='{"client_id":"YOUR_CLIENT_ID","client_secret":"YOUR_CLIENT_SECRET"}'
apiVersion: v1
kind: Secret
metadata:
  name: arubacloud-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    {
      "client_id": "YOUR_CLIENT_ID",
      "client_secret": "YOUR_CLIENT_SECRET",
      "resource_timeout": "30m"
    }
