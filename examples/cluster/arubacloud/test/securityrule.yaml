---
apiVersion: arubacloud.crossplane.io/v1alpha1
kind: Securityrule
metadata:
  name: allow-ssh
spec:
  forProvider:
    name: allow-ssh
    location: ITBG-Bergamo
    projectIdRef:
      name: my-project
    vpcIdRef:
      name: main-vpc
    securityGroupIdRef:
      name: web-sg
    properties:
      direction: Ingress
      protocol: TCP
      port: "22"
      target:
        kind: Ip
        value: "0.0.0.0/0"
  providerConfigRef:
    name: default
---
apiVersion: arubacloud.crossplane.io/v1alpha1
