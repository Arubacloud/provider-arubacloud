---
apiVersion: arubacloud.crossplane.io/v1alpha1
kind: Securityrule
metadata:
  name: allow-egress
spec:
  forProvider:
    name: allow-egress
    location: ITBG-Bergamo
    projectIdRef:
      name: my-project
    vpcIdRef:
      name: main-vpc
    securityGroupIdRef:
      name: web-sg
