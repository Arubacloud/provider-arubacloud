name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.0.5). Must match an existing git tag."
        required: true

env:
  # publish.artifacts in the makelib is gated on BRANCH_NAME being main/master/release-*
  BRANCH_NAME: main
  # Pin VERSION to the tag name so git describe cannot pick the wrong tag when
  # multiple tags share the same commit (e.g. v0.0.4 and v0.0.6 at the same SHA).
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Upbound Marketplace
        uses: docker/login-action@v3
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_USR }}
          password: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_PSW }}

      - name: Install up CLI
        run: |
          curl -fsSLo up https://cli.upbound.io/stable/current/bin/linux_amd64/up
          chmod +x up
          sudo mv up /usr/local/bin/
          up version

      - name: Vendor Dependencies
        run: make vendor

      - name: Build and Publish
        run: make build.all publish.artifacts

      - name: Append Extensions (icon)
        run: |
          up alpha xpkg append \
            --extensions-root=./extensions \
            xpkg.upbound.io/arubacloud/provider-arubacloud:${{ env.VERSION }}
