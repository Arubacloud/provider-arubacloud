            security_group_uri_ref: (String) URI reference to the Security Group resource.
            size_gb: (Number) Storage size in GB for the DBaaS instance.
            step_size: (Number) Amount of storage (in GB) added on each autoscaling event.
            storage: (Attributes) Storage configuration for the DBaaS instance. (see below for nested schema)
            subnet_uri_ref: (String) URI reference to the Subnet resource.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
