            autoscaling: (Attributes) Optional autoscaling configuration for the DBaaS storage. (see below for nested schema)
            available_space: (Number) Minimum available space threshold in GB. When the available storage falls below this value, autoscaling increases storage by the step_size amount.
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year. If omitted, the value returned by the API is used (Computed).'
            elastic_ip_uri_ref: (String) Optional URI reference to an Elastic IP resource.
            enabled: (Boolean) Whether storage autoscaling is enabled.
            engine_id: (String) Database engine type and version identifier (e.g., mysql-8.0 for MySQL 8.0, postgresql-15 for PostgreSQL 15). See the available engines. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            flavor: (String) Compute flavour for the DBaaS cluster nodes. See available flavours. For example, DBO2A4 means 2 vCPU and 4 GB RAM.
            id: (String) Computed by the API. Unique identifier for the resource.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            name: (String) Display name for the DBaaS cluster.
            network: (Attributes) Network configuration for the DBaaS instance. All URI references are immutable after creation. (see below for nested schema)
