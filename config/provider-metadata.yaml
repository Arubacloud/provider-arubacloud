name: arubacloud/arubacloud
resources:
    Acceptance Testing - ArubaCloud Provider Development:
        subCategory: Development
        description: How to run acceptance tests for the ArubaCloud Terraform provider, including required environment variables and CI setup.
        name: Acceptance Testing - ArubaCloud Provider Development
        title: Acceptance Testing - ArubaCloud Provider Development
        argumentDocs:
            ARUBACLOUD_PROJECT_ID: )
            PATH: (acceptance tests drive whichever binary you point them at)
            terraform: binary.
            tofu: binary.
        importStatements: []
    ArubaCloud:
        subCategory: ""
        description: The ArubaCloud Terraform provider manages compute, network, storage, database, container, and security resources on the ArubaCloud platform.
        name: ArubaCloud
        title: ArubaCloud
        argumentDocs:
            VAR=value command: prefix form only applies to the command on that line. Setting them on a blank line is a no-op. Use a single-line invocation (TF_LOG=DEBUG terraform plan) or export TF_LOG=DEBUG first.
            base_url: '- (Optional, string) Override the ArubaCloud API base URL. Advanced use only.'
            client_id: '- (Required, string) ArubaCloud OAuth2 client ID. Can also be specified with the ARUBACLOUD_CLIENT_ID environment variable.'
            client_secret: '- (Required, string) ArubaCloud OAuth2 client secret. Can also be specified with the ARUBACLOUD_CLIENT_SECRET environment variable.'
            log_level: '- (Optional, string) SDK log level for HTTP request/response tracing. Accepted values (case-insensitive): OFF, ERROR, WARN, INFO, DEBUG, TRACE. Default: OFF. Can also be set via the ARUBACLOUD_LOG_LEVEL environment variable; the HCL attribute takes precedence.'
            log_level = "DEBUG": set but no output appears
            log_level = "OFF": (the default) or omit it. Provider-level tflog calls (resource lifecycle events, wait/retry status) are unaffected by log_level and continue to respect TF_LOG alone.
            resource_timeout: '- (Optional, string) Timeout for waiting for resources to become active after creation (e.g. "15m", "45m"). Default: "30m".'
            terraform: run on the next
            token_issuer_url: '- (Optional, string) Override the ArubaCloud token issuer URL. Advanced use only.'
        importStatements: []
    Upgrading to v0.2.0 - ArubaCloud Provider:
        subCategory: Guides
        description: How to upgrade from ArubaCloud provider v0.1.x to v0.2.0, including authentication rename and expected state behaviour.
        name: Upgrading to v0.2.0 - ArubaCloud Provider
        title: Upgrading to v0.2.0 - ArubaCloud Provider
        argumentDocs: {}
        importStatements: []
    arubacloud_backup:
        subCategory: Storage
        description: Manages an ArubaCloud Block Storage Backup.
        name: arubacloud_backup
        title: arubacloud_backup Resource - ArubaCloud
        examples:
            - name: basic
              manifest: |-
                {
                  "billing_period": "monthly",
                  "location": "ITBG-Bergamo",
                  "name": "example-backup",
                  "project_id": "project-123",
                  "retention_days": 30,
                  "tags": [
                    "env:dev",
                    "service:demo"
                  ],
                  "type": "full",
                  "volume_id": "volume-123"
                }
        argumentDocs:
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            id: (String) Computed by the API. Unique identifier for the resource.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            name: (String) Display name for the backup.
            project_id: (String) ID of the project that owns this resource. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            retention_days: (Number) Number of days to retain the backup before automatic deletion. Optional — if omitted, the backup is retained indefinitely. (Immutable — changing this value forces the resource to be destroyed and re-created, because the API does not apply retention_days changes in update requests.)
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            type: '(String) Backup type. Accepted values: Full, Incremental. (Immutable — changing this value forces the resource to be destroyed and re-created.)'
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources.
            volume_id: (String) ID of the block storage volume to back up. (Immutable — changing this value forces the resource to be destroyed and re-created.)
        importStatements:
            - terraform import arubacloud_backup.example <backup-id>
    arubacloud_backup Data Source - ArubaCloud:
        subCategory: Storage
        description: Retrieves information about an existing ArubaCloud Block Storage Backup.
        name: arubacloud_backup Data Source - ArubaCloud
        title: arubacloud_backup Data Source - ArubaCloud
        argumentDocs:
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            id: (String) Unique identifier of the backup to look up.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones.
            name: (String) Display name for the backup.
            project_id: (String) ID of the project that owns this resource.
            retention_days: (Number) Number of days to retain the backup before automatic deletion. Optional — if omitted, the backup is retained indefinitely.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            type: '(String) Backup type. Accepted values: Full, Incremental.'
            uri: (String) Computed by the API. Full resource URI. Use this value in *_uri_ref attributes of other resources.
            volume_id: (String) ID of the block storage volume this backup was taken from.
        importStatements: []
    arubacloud_blockstorage:
        subCategory: Storage
        description: Manages an ArubaCloud Block Storage volume.
        name: arubacloud_blockstorage
        title: arubacloud_blockstorage Resource - ArubaCloud
        examples:
            - name: zonal_example
              manifest: |-
                {
                  "billing_period": "Hour",
                  "location": "ITBG-Bergamo",
                  "name": "zonal-blockstorage",
                  "project_id": "your-project-id",
                  "size_gb": 100,
                  "tags": [
                    "storage",
                    "zonal",
                    "test"
                  ],
                  "type": "Standard",
                  "zone": "ITBG-1"
                }
            - name: regional_example
              manifest: |-
                {
                  "billing_period": "Hour",
                  "location": "ITBG-Bergamo",
                  "name": "regional-blockstorage",
                  "project_id": "your-project-id",
                  "size_gb": 100,
                  "tags": [
                    "storage",
                    "regional",
                    "test"
                  ],
                  "type": "Standard"
                }
        argumentDocs:
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            bootable: (Boolean) Whether this volume can be used as a boot volume for an arubacloud_cloudserver. Must be true when image is set.
            id: (String) Computed by the API. Unique identifier for the resource.
            image: (String) Image ID to use when creating a bootable volume. Required when bootable is true. See the available images.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            name: (String) Display name for the block storage volume.
            project_id: (String) ID of the project that owns this resource. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            size_gb: (Number) Size of the block storage volume in GiB. Must be a positive integer.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            type: '(String) Storage type. Accepted values: Standard, Performance. (Immutable — changing this value forces the resource to be destroyed and re-created.)'
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources.
            zone: (String) Availability zone within the region. If omitted the volume is regional (accessible across all zones).
        importStatements:
            - terraform import arubacloud_blockstorage.example <blockstorage-id>
    arubacloud_blockstorage Data Source - ArubaCloud:
        subCategory: Storage
        description: Retrieves information about an existing ArubaCloud Block Storage volume.
        name: arubacloud_blockstorage Data Source - ArubaCloud
        title: arubacloud_blockstorage Data Source - ArubaCloud
        argumentDocs:
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            bootable: (Boolean) Whether this volume can be used as a boot volume for an arubacloud_cloudserver. Must be true when image is set.
            id: (String) Unique identifier of the block storage volume to look up.
            image: (String) Image ID to use when creating a bootable volume. Required when bootable is true. See the available images.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones.
            name: (String) Display name for the block storage volume.
            project_id: (String) ID of the project that owns this resource.
            size_gb: (Number) Size of the block storage volume in GiB. Must be a positive integer.
            snapshot_id: (String) ID of the snapshot this volume was created from, if any.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            type: '(String) Storage type. Accepted values: Standard, Performance.'
            uri: (String) Computed by the API. Full resource URI. Use this value in *_uri_ref attributes of other resources.
            zone: (String) Availability zone within the region. If omitted the volume is regional (accessible across all zones).
        importStatements: []
    arubacloud_cloudserver:
        subCategory: Compute
        description: Manages an ArubaCloud CloudServer virtual machine.
        name: arubacloud_cloudserver
        title: arubacloud_cloudserver Resource - ArubaCloud
        examples:
            - name: basic
              manifest: |-
                {
                  "location": "ITBG-Bergamo",
                  "name": "example-cloudserver",
                  "network": {
                    "elastic_ip_uri_ref": "${arubacloud_elasticip.example.uri}",
                    "securitygroup_uri_refs": [
                      "${arubacloud_securitygroup.example.uri}"
                    ],
                    "subnet_uri_refs": [
                      "${arubacloud_subnet.example.uri}"
                    ],
                    "vpc_uri_ref": "${arubacloud_vpc.example.uri}"
                  },
                  "project_id": "${arubacloud_project.example.id}",
                  "settings": {
                    "flavor_name": "CSO4A8",
                    "key_pair_uri_ref": "${arubacloud_keypair.example.uri}"
                  },
                  "storage": {
                    "boot_volume_uri_ref": "${arubacloud_blockstorage.example.uri}"
                  },
                  "tags": [
                    "compute",
                    "example"
                  ],
                  "zone": "ITBG-1"
                }
              references:
                project_id: arubacloud_project.example.id
        argumentDocs:
            boot_volume_uri_ref: (String) URI of the bootable block storage volume. Reference the uri attribute of an arubacloud_blockstorage resource (must be bootable). Changing this value forces a new resource.
            elastic_ip_uri_ref: (String) URI of an Elastic IP to associate with this CloudServer. Reference the uri attribute of an arubacloud_elasticip resource. Optional — omit to use a dynamic IP. Changing this value forces a new resource.
            flavor_name: (String) Compute flavour name (e.g., CSO4A8 for 4 vCPU / 8 GB RAM). See available flavours. Changing this value forces a new resource.
            id: (String) Computed by the API. Unique identifier for the resource.
            key_pair_uri_ref: (String) URI of the SSH key pair to inject at boot. Reference the uri attribute of an arubacloud_keypair resource. Changing this value forces a new resource.
            location: (String) Region identifier for the resource (e.g., ITBG-Bergamo). See the available locations and zones. Changing this value forces a new resource.
            name: (String) Display name for the CloudServer. Changing this value forces a new resource.
            network: (Attributes) Network configuration for the CloudServer. (see below for nested schema)
            project_id: (String) ID of the project that owns this resource. Changing this value forces a new resource.
            securitygroup_uri_refs: (List of String) List of security group URIs to apply to this CloudServer. Reference the uri attribute of each arubacloud_securitygroup resource. Changing this value forces a new resource.
            settings: (Attributes) Compute and access settings for the CloudServer. (see below for nested schema)
            storage: (Attributes) Storage configuration for the CloudServer. (see below for nested schema)
            subnet_uri_refs: (List of String) List of subnet URIs to attach this CloudServer to. Reference the uri attribute of each arubacloud_subnet resource. Changing this value forces a new resource.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation. Changing this value forces a new resource.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources (e.g., as a *_uri_ref attribute).
            user_data: (String, Sensitive) Cloud-Init configuration passed verbatim to the instance at first boot (raw YAML or shell-script). Write-only — this value is sent to the API but is not returned in subsequent read responses. Changing this value forces a new resource.
            vpc_uri_ref: (String) URI of the VPC to attach this CloudServer to. Reference the uri attribute of an arubacloud_vpc resource. Changing this value forces a new resource.
            zone: (String) Availability zone within the region (e.g., ITBG-1). See available zones. Changing this value forces a new resource.
        importStatements:
            - terraform import arubacloud_cloudserver.example <cloudserver-id>
    arubacloud_cloudserver Data Source - ArubaCloud:
        subCategory: Compute
        description: Retrieves information about an existing ArubaCloud CloudServer virtual machine.
        name: arubacloud_cloudserver Data Source - ArubaCloud
        title: arubacloud_cloudserver Data Source - ArubaCloud
        argumentDocs:
            boot_volume_uri_ref: (String) URI of the bootable block storage volume.
            elastic_ip_uri_ref: (String) URI of the Elastic IP associated with this CloudServer, if any.
            flavor_name: (String) Compute flavour name (e.g., CSO4A8 for 4 vCPU / 8 GB RAM).
            id: (String) Computed by the API. Unique identifier for the resource.
            key_pair_uri_ref: (String) URI of the SSH key pair injected at boot.
            location: (String) Region identifier for the resource (e.g., ITBG-Bergamo).
            name: (String) Display name for the CloudServer.
            project_id: (String) ID of the project that owns this resource.
            securitygroup_uri_refs: (List of String) List of security group URIs applied to this CloudServer.
            subnet_uri_refs: (List of String) List of subnet URIs attached to this CloudServer.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            uri: (String) Computed by the API. Full resource URI.
            user_data: (String) Cloud-Init configuration passed to the instance at first boot.
            vpc_uri_ref: (String) URI of the VPC attached to this CloudServer.
            zone: (String) Availability zone within the region (e.g., ITBG-1).
        importStatements: []
    arubacloud_containerregistry:
        subCategory: Container
        description: Manages an ArubaCloud Container Registry — a private OCI-compatible image registry.
        name: arubacloud_containerregistry
        title: arubacloud_containerregistry Resource - ArubaCloud
        examples:
            - name: example
              manifest: |-
                {
                  "billing_period": "Hour",
                  "location": "ITBG-Bergamo",
                  "name": "example-container-registry",
                  "network": {
                    "public_ip_uri_ref": "${arubacloud_elasticip.example.uri}",
                    "security_group_uri_ref": "${arubacloud_securitygroup.example.uri}",
                    "subnet_uri_ref": "${arubacloud_subnet.example.uri}",
                    "vpc_uri_ref": "${arubacloud_vpc.example.uri}"
                  },
                  "project_id": "your-project-id",
                  "settings": {
                    "admin_user": "adminuser",
                    "concurrent_users_flavor": "Small"
                  },
                  "storage": {
                    "block_storage_uri_ref": "${arubacloud_blockstorage.example.uri}"
                  },
                  "tags": [
                    "container",
                    "test"
                  ]
                }
        argumentDocs:
            admin_user: (String) Administrator username for the registry. Must not be "admin" (reserved by the API).
            arubacloud_project: ', arubacloud_vpc, arubacloud_subnet, arubacloud_elasticip, arubacloud_securitygroup, arubacloud_blockstorage'
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            block_storage_uri_ref: (String) URI of the block storage volume (e.g., arubacloud_blockstorage.example.uri).
            concurrent_users_flavor: '(String) Concurrency tier that determines how many simultaneous push/pull sessions are supported. Accepted values: Small, Medium, HighPerf.'
            id: (String) Computed by the API. Unique identifier for the resource.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones.
            name: (String) Display name for the container registry.
            network: (Attributes) Network resources attached to the registry. (see below for nested schema)
            project_id: (String) ID of the project that owns this resource.
            public_ip_uri_ref: (String) URI of the Elastic IP that exposes the registry endpoint (e.g., arubacloud_elasticip.example.uri).
            security_group_uri_ref: (String) URI of the security group controlling registry traffic (e.g., arubacloud_securitygroup.example.uri).
            settings: (Attributes) Registry configuration settings. Required because admin_user is mandatory. (see below for nested schema)
            storage: (Attributes) Block storage volume that backs the registry image store. (see below for nested schema)
            subnet_uri_ref: (String) URI of the subnet within the VPC (e.g., arubacloud_subnet.example.uri).
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources.
            vpc_uri_ref: (String) URI of the VPC that hosts the registry (e.g., arubacloud_vpc.example.uri).
        importStatements:
            - terraform import arubacloud_containerregistry.example <containerregistry-id>
    arubacloud_containerregistry Data Source - ArubaCloud:
        subCategory: Container
        description: Retrieves information about an existing ArubaCloud Container Registry.
        name: arubacloud_containerregistry Data Source - ArubaCloud
        title: arubacloud_containerregistry Data Source - ArubaCloud
        argumentDocs:
            admin_user: (String) Administrator username for the registry.
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            block_storage_uri_ref: (String) URI of the block storage volume backing the registry image store.
            concurrent_users_flavor: (String) Concurrency tier for simultaneous push/pull sessions (Small, Medium, HighPerf).
            id: (String) Unique identifier of the container registry to look up.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones.
            name: (String) Display name for the container registry.
            project_id: (String) ID of the project that owns this resource.
            public_ip_uri_ref: (String) URI of the Elastic IP that exposes the registry endpoint.
            security_group_uri_ref: (String) URI of the security group controlling registry traffic.
            subnet_uri_ref: (String) URI of the subnet within the VPC.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources.
            vpc_uri_ref: (String) URI of the VPC that hosts the registry.
        importStatements: []
    arubacloud_database:
        subCategory: Database
        description: Manages a logical database within an ArubaCloud DBaaS cluster.
        name: arubacloud_database
        title: arubacloud_database Resource - ArubaCloud
        examples:
            - name: basic
              manifest: |-
                {
                  "name": "basic-database"
                }
        argumentDocs:
            arubacloud_dbaas: cluster referenced by dbaas_id.
            dbaas_id: (String) ID of the parent DBaaS cluster this database belongs to.
            id: (String) Computed by the API. Unique identifier for the resource (same as the database name).
            name: (String) Display name for the database. The database API does not support renaming — changing this value forces the resource to be destroyed and re-created. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            project_id: (String) ID of the project that owns this resource.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources.
        importStatements:
            - terraform import arubacloud_database.example <database-id>
    arubacloud_database Data Source - ArubaCloud:
        subCategory: Database
        description: Retrieves information about an existing ArubaCloud database within a DBaaS cluster.
        name: arubacloud_database Data Source - ArubaCloud
        title: arubacloud_database Data Source - ArubaCloud
        argumentDocs:
            dbaas_id: (String) ID of the parent DBaaS cluster this database belongs to.
            id: (String) Unique identifier of the database to look up (same as the database name).
            name: (String) Display name for the database.
            project_id: (String) ID of the project that owns this resource.
            uri: (String) Computed by the API. Full resource URI. Use this value in *_uri_ref attributes of other resources.
        importStatements: []
    arubacloud_databasebackup:
        subCategory: Database
        description: Manages a backup of an ArubaCloud DBaaS database.
        name: arubacloud_databasebackup
        title: arubacloud_databasebackup Resource - ArubaCloud
        examples:
            - name: basic
              manifest: |-
                {
                  "database": "example-database",
                  "location": "example-location",
                  "name": "example-database-backup",
                  "project_id": "example-project"
                }
        argumentDocs:
            arubacloud_dbaas: cluster and an existing arubacloud_database.
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            database: (String) Name of the logical database within the DBaaS cluster to back up.
            dbaas_id: (String) ID of the DBaaS cluster or database to back up.
            id: (String) Computed by the API. Unique identifier for the resource.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones.
            name: (String) Auto-generated backup name assigned by the API (e.g. mysql_wordpress_20260713140736). The value provided in config is not used — the API always generates its own name.
            project_id: (String) ID of the project that owns this resource.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources.
            zone: (String) Availability zone within the region where the backup is stored.
        importStatements:
            - terraform import arubacloud_databasebackup.example <databasebackup-id>
    arubacloud_databasebackup Data Source - ArubaCloud:
        subCategory: Database
        description: Retrieves information about an existing ArubaCloud database backup.
        name: arubacloud_databasebackup Data Source - ArubaCloud
        title: arubacloud_databasebackup Data Source - ArubaCloud
        argumentDocs:
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            database: (String) Name or ID of the logical database this backup was taken from.
            dbaas_id: (String) ID of the DBaaS cluster this backup belongs to.
            id: (String) Unique identifier of the database backup to look up.
            location: (String) Region identifier where the backup is stored.
            name: (String) Display name for the database backup.
            project_id: (String) ID of the project that owns this resource.
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            uri: (String) Computed by the API. Full resource URI. Use this value in *_uri_ref attributes of other resources.
            zone: (String) Availability zone within the region where the backup is stored.
        importStatements: []
    arubacloud_databasegrant:
        subCategory: Database
        description: Manages a privilege grant for an ArubaCloud DBaaS user on a specific database.
        name: arubacloud_databasegrant
        title: arubacloud_databasegrant Resource - ArubaCloud
        examples:
            - name: example
              manifest: |-
                {
                  "database": "${arubacloud_database.example.id}",
                  "dbaas_id": "${arubacloud_dbaas.example.id}",
                  "project_id": "${arubacloud_project.example.id}",
                  "role": "readwrite",
                  "user_id": "${arubacloud_dbaasuser.example.id}"
                }
              references:
                database: arubacloud_database.example.id
                dbaas_id: arubacloud_dbaas.example.id
                project_id: arubacloud_project.example.id
                user_id: arubacloud_dbaasuser.example.id
        argumentDocs:
            arubacloud_dbaas: cluster, arubacloud_database, and arubacloud_dbaasuser.
            database: (String) ID of the database this grant applies to. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            dbaas_id: (String) ID of the parent DBaaS cluster this grant belongs to. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            id: '(String) Computed by the API. Unique identifier for the resource (composite key: project_id/dbaas_id/database/user_id).'
            project_id: (String) ID of the project that owns this resource. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            role: (String) Privilege level granted. Accepted values depend on the database engine (e.g., ALL, READ, WRITE). The DBaaS grant API does not support in-place role changes. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources.
            user_id: (String) Name or ID of the DBaaS user receiving the grant. (Immutable — changing this value forces the resource to be destroyed and re-created.)
        importStatements:
            - terraform import arubacloud_databasegrant.example <databasegrant-id>
    arubacloud_databasegrant Data Source - ArubaCloud:
        subCategory: Database
        description: Retrieves information about an existing ArubaCloud database grant.
        name: arubacloud_databasegrant Data Source - ArubaCloud
        title: arubacloud_databasegrant Data Source - ArubaCloud
        argumentDocs:
            database: (String) ID of the database this grant applies to.
            dbaas_id: (String) ID of the parent DBaaS cluster this grant belongs to.
