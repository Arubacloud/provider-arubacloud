    arubacloud_kaas:
        subCategory: Container
        description: Manages an ArubaCloud Kubernetes cluster (KaaS — Kubernetes-as-a-Service).
        name: arubacloud_kaas
        title: arubacloud_kaas Resource - ArubaCloud
        examples:
            - name: basic
              manifest: |-
                {
                  "billing_period": "Hour",
                  "location": "ITBG-Bergamo",
                  "name": "basic-kaas",
                  "network": [
                    {
                      "node_cidr": {
                        "address": "10.0.2.0/24",
                        "name": "kaas-node-cidr"
                      },
                      "pod_cidr": "10.0.3.0/24",
                      "security_group_name": "kaas-security-group",
                      "subnet_uri_ref": "${arubacloud_subnet.example.uri}",
                      "vpc_uri_ref": "${arubacloud_vpc.example.uri}"
                    }
                  ],
                  "project_id": "your-project-id",
                  "settings": [
                    {
                      "ha": true,
                      "kubernetes_version": "1.33.2",
                      "node_pools": [
                        {
                          "autoscaling": true,
                          "instance": "K2A4",
                          "max_count": 5,
                          "min_count": 1,
                          "name": "pool-1",
                          "nodes": 2,
                          "zone": "ITBG-1"
                        }
                      ]
                    }
                  ],
                  "tags": [
                    "k8s",
                    "test"
                  ]
                }
              references:
                network.subnet_uri_ref: arubacloud_subnet.example.uri
                network.vpc_uri_ref: arubacloud_vpc.example.uri
        argumentDocs:
            address: (String) Node CIDR address in CIDR notation (e.g., 10.0.0.0/24).
            arubacloud_project: ', arubacloud_vpc, arubacloud_subnet'
            autoscaling: (Boolean) When true, the node pool scales automatically between min_count and max_count.
            billing_period: '(String) Billing cycle. Accepted values: Hour, Month, Year.'
            ha: (Boolean) When true, the control plane is deployed in high-availability mode.
            id: (String) Computed by the API. Unique identifier for the resource.
            instance: (String) Compute flavour for cluster nodes (e.g., CSO4A8). See available flavours.
            kubeconfig: (String, Sensitive) Kubeconfig YAML for kubectl access. Populated automatically when the cluster becomes active. Sensitive — stored in Terraform state but redacted from plan output.
            kubernetes_version: (String) Kubernetes version string (e.g., 1.28). Available versions are listed in the ArubaCloud metadata API.
            location: (String) Region identifier (e.g., ITBG-Bergamo). See the available locations and zones. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            management_ip: (String) Computed by the API. Management IP address of the cluster control plane, available once the cluster is active.
            max_count: (Number) Maximum number of nodes when autoscaling is enabled.
            min_count: (Number) Minimum number of nodes when autoscaling is enabled.
            name: (String) Display name for the KaaS cluster.
            network: (Attributes) Network configuration for the KaaS cluster. (see below for nested schema)
            node_cidr: (Attributes) CIDR block assigned to cluster nodes. (see below for nested schema)
            node_pools: (Attributes List) One or more node pools that make up the cluster worker fleet. (see below for nested schema)
            nodes: (Number) Number of worker nodes in the cluster.
            pod_cidr: (String) CIDR block used for pod networking within the cluster (e.g., 10.0.3.0/24).
            project_id: (String) ID of the project that owns this resource. (Immutable — changing this value forces the resource to be destroyed and re-created.)
            security_group_name: (String) Name of the security group applied to cluster nodes.
            settings: (Attributes) Kubernetes version and node-pool configuration. (see below for nested schema)
            subnet_uri_ref: (String) URI of the subnet within the VPC (e.g., arubacloud_subnet.example.uri). (Immutable — changing this value forces the resource to be destroyed and re-created.)
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources.
            vpc_uri_ref: (String) URI of the VPC that hosts the cluster (e.g., arubacloud_vpc.example.uri). (Immutable — changing this value forces the resource to be destroyed and re-created.)
            zone: (String) Datacenter zone code where the node pool is deployed.
        importStatements:
            - terraform import arubacloud_kaas.example <kaas-id>
