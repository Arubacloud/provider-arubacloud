    arubacloud_vpntunnel:
        subCategory: Network
        description: Manages an ArubaCloud VPN Tunnel — an IPSec site-to-site VPN connection between an ArubaCloud VPC and an external network.
        name: arubacloud_vpntunnel
        title: arubacloud_vpntunnel Resource - ArubaCloud
        examples:
            - name: example
              manifest: |-
                {
                  "location": "ITBG-Bergamo",
                  "name": "example-vpn-tunnel",
                  "project_id": "your-project-id",
                  "properties": {
                    "vpn_client_protocol": "ikev2",
                    "vpn_type": "Site-To-Site"
                  }
                }
        argumentDocs:
            billing_period: '(String) Billing cycle for the resource. Accepted values: Hour, Month, Year.'
            cidr: (String) CIDR block of the subnet (e.g. 192.168.10.0/24). Required by the API.
            cloud_site: (String) Pre-shared key for the ArubaCloud side of the tunnel.
            dh_group: '(String) IKE Diffie-Hellman group. Use the numeric group identifier: "1", "2", "5", "14" … "32". The common choice for IKEv2 is "14" (MODP-2048).'
            dpd_action: (String) Dead Peer Detection action on failure (e.g., restart).
            dpd_interval: (Number) DPD keep-alive interval in seconds.
            dpd_timeout: (Number) DPD timeout before the peer is considered dead, in seconds.
            encryption: (String) ESP encryption algorithm (e.g., aes256).
            esp: (Attributes) ESP (Encapsulating Security Payload) phase-2 settings. (see below for nested schema)
            hash: (String) ESP integrity/hash algorithm (e.g., sha256).
            id: (String) Computed by the API. Unique identifier for the resource.
            ike: (Attributes) IKE (Internet Key Exchange) phase-1 settings. (see below for nested schema)
            ip_configurations: (Attributes) Network references for the VPN tunnel — VPC, subnet, and public IP. (see below for nested schema)
            lifetime: (Number) ESP phase-2 lifetime in seconds.
            location: (String) Region identifier for the resource (e.g., ITBG-Bergamo). See the available locations and zones.
            name: (String) Display name for the VPN tunnel.
            on_prem_site: (String) Pre-shared key for the on-premises side of the tunnel.
            peer_client_public_ip: (String) Public IP address of the remote peer (on-premises gateway).
            pfs: (String) ESP Perfect Forward Secrecy group. Use "enable", "disable", or "dh-group<N>" (e.g. "dh-group14" for MODP-2048).
            project_id: (String) ID of the project that owns this resource.
            properties: (Attributes) Configuration properties for the VPN tunnel. (see below for nested schema)
            properties.vpn_client_settings.psk.secret: — sent to the API but not returned in read responses.
            psk: (Attributes) Pre-Shared Key (PSK) authentication settings. (see below for nested schema)
            public_ip: (Attributes) Reference to the elastic public IP assigned to this tunnel. (see below for nested schema)
            secret: (String) Shared secret used to authenticate the VPN tunnel. Write-only — this value is sent to the API but is not returned in subsequent read responses.
            subnet: (Attributes) Reference to the subnet used by this tunnel. (see below for nested schema)
            tags: (List of String) List of string tags attached to the resource for filtering and organisation.
            timeout: (String) Per-resource timeout override (e.g. "15m", "1h"). Overrides the provider-level resource_timeout for this resource's Create and Delete operations. Uses Go duration syntax.
            uri: (String) Computed by the API. Full resource URI used as a reference value in other resources (e.g., as a *_uri_ref attribute).
            vpc: (Attributes) Reference to the VPC this tunnel is attached to. (see below for nested schema)
            vpn_client_protocol: '(String) IKE protocol version. Accepted values: ikev2.'
            vpn_client_settings: (Attributes) IKE/ESP/PSK client settings for the VPN tunnel. (see below for nested schema)
            vpn_type: '(String) Type of VPN tunnel. Accepted values: Site-To-Site.'
        importStatements:
            - terraform import arubacloud_vpntunnel.example <vpntunnel-id>
    arubacloud_vpntunnel Data Source - ArubaCloud:
        subCategory: Network
        description: Retrieves information about an existing ArubaCloud VPN Tunnel.
        name: arubacloud_vpntunnel Data Source - ArubaCloud
        title: arubacloud_vpntunnel Data Source - ArubaCloud
        argumentDocs:
            id: (String) Unique identifier of the VPN tunnel to look up.
            name: (String) Display name for the VPN tunnel.
            project_id: (String) ID of the project that owns this resource.
            remote_peer: (String) Public IP address of the remote peer (on-premises gateway).
            status: (String) Current operational status of the VPN tunnel.
            uri: (String) Computed by the API. Full resource URI. Use this value in *_uri_ref attributes of other resources.
        importStatements: []
